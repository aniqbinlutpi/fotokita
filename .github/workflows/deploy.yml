name: Deploy to Ubuntu Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Fotokita
    runs-on: self-hosted

    steps:
      - name: Deploy Fotokita Application
        run: |
          set -e
          export PATH="/home/ubuntu/.bun/bin:$HOME/.bun/bin:$PATH"

          echo "🚀 Starting automated deployment on self-hosted server..."
          cd /home/ubuntu/apps/fotokita

          echo "📥 Fetching latest updates from git..."
          git pull origin main

          echo "📦 Updating backend microservices dependencies..."
          cd services/wedding-service && bun install
          cd ../media-service && bun install
          cd ../admin-service && bun install
          cd ../tenant-service && bun install

          echo "🔨 Building frontend assets..."
          cd ../../frontend
          bun install
          bun run build

          echo "🔄 Restarting microservices..."
          sudo systemctl restart fotokita-wedding fotokita-media fotokita-admin fotokita-tenant

          echo "🎉 Deployment successfully completed!"
