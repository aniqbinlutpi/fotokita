services:
  postgres:
    image: postgres:18
    container_name: fotokita-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fotokita
      POSTGRES_PASSWORD: fotokita
      POSTGRES_DB: fotokita
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
